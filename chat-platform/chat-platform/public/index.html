<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat Platform</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Page de connexion -->
  <div id="auth-page" class="page active">
    <div class="auth-container">
      <div class="auth-card">
        <h1>💬 Chat Platform</h1>
        <p class="subtitle">Messagerie instantanée sécurisée</p>
        
        <div class="tabs">
          <button class="tab active" data-tab="login">Connexion</button>
          <button class="tab" data-tab="register">Inscription</button>
        </div>
        
        <!-- Formulaire de connexion -->
        <form id="login-form" class="auth-form active">
          <div class="form-group">
            <input type="text" id="login-username" placeholder="Nom d'utilisateur" required>
          </div>
          <div class="form-group">
            <input type="password" id="login-password" placeholder="Mot de passe" required>
          </div>
          <button type="submit" class="btn btn-primary">Se connecter</button>
        </form>
        
        <!-- Formulaire d'inscription -->
        <form id="register-form" class="auth-form">
          <div class="form-group">
            <input type="text" id="register-username" placeholder="Nom d'utilisateur (3-30 caractères)" required>
          </div>
          <div class="form-group">
            <input type="password" id="register-password" placeholder="Mot de passe (min 6 caractères)" required>
          </div>
          <button type="submit" class="btn btn-primary">S'inscrire</button>
        </form>
        
        <div id="auth-message" class="message"></div>
      </div>
    </div>
  </div>

  <!-- Page principale -->
  <div id="main-page" class="page">
    <div class="app-container">
      <!-- Sidebar -->
      <aside class="sidebar">
        <div class="sidebar-header">
          <div class="user-info">
            <div class="avatar" id="user-avatar">U</div>
            <div>
              <h3 id="username-display">Utilisateur</h3>
              <span class="status-online">● En ligne</span>
            </div>
          </div>
          <button class="btn-logout" id="logout-btn" title="Déconnexion">🚪</button>
        </div>

        <!-- Notifications -->
        <div class="section">
          <div class="section-header">
            <h4>🔔 Notifications</h4>
            <span class="badge" id="notif-badge">0</span>
          </div>
          <div id="notifications-list" class="list"></div>
        </div>

        <!-- Recherche utilisateurs -->
        <div class="section">
          <div class="section-header">
            <h4>👤 Inviter</h4>
          </div>
          <div class="search-box">
            <input type="text" id="user-search" placeholder="Rechercher un utilisateur...">
            <button id="search-btn">🔍</button>
          </div>
          <div id="search-results" class="list"></div>
        </div>

        <!-- Conversations -->
        <div class="section">
          <div class="section-header">
            <h4>💬 Conversations</h4>
          </div>
          <div id="conversations-list" class="list"></div>
        </div>
      </aside>

      <!-- Zone de chat -->
      <main class="chat-area">
        <div id="welcome-screen" class="welcome active">
          <div class="welcome-content">
            <h2>👋 Bienvenue !</h2>
            <p>Sélectionnez une conversation ou recherchez un utilisateur pour commencer</p>
          </div>
        </div>

        <div id="chat-screen" class="chat">
          <div class="chat-header">
            <div class="chat-info">
              <h3 id="chat-title">Conversation</h3>
            </div>
            <button class="btn-close" id="close-chat">✕</button>
          </div>
          
          <div id="messages-area" class="messages"></div>
          
          <div class="message-input-area">
            <input type="text" id="message-input" placeholder="Écrivez votre message...">
            <button id="send-btn" class="btn btn-primary">Envoyer</button>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="app.js"></script>
</body>
</html>
